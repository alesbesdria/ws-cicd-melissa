
name: CI/CD - Déploiement Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t ghcr.io/alesbesdria/ws-cicd-melissa:latest .
          docker push ghcr.io/alesbesdria/ws-cicd-melissa:latest

      - name: Déployer sur Azure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/alesbesdria/ws-cicd-melissa:latest
            docker rm -f webapp || true
            docker run -d \
              --name webapp \
              --restart unless-stopped \
              -p 80:5000 \
              ghcr.io/alesbesdria/ws-cicd-melissa:latest
            sleep 5
            curl --fail --retry-all-errors --retry 10 --retry-delay 3 http://localhost/health
