
name: CI/CD - Déploiement Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -t ghcr.io/alesbesdria/ws-cicd-melissa:${GITHUB_SHA} .
          docker push ghcr.io/alesbesdria/ws-cicd-melissa:${GITHUB_SHA}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Préparer SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_cicd
          chmod 600 ~/.ssh/deploy_cicd
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Déployer sur Azure
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_cicd \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e
             docker pull ghcr.io/alesbesdria/ws-cicd-melissa:${GITHUB_SHA}
             docker rm -f webapp || true
             docker run -d \
               --name webapp \
               --restart unless-stopped \
               -p 80:5000 \
               ghcr.io/alesbesdria/ws-cicd-melissa:${GITHUB_SHA}
             sleep 5
             curl --fail --retry-all-errors --retry 10 --retry-delay 3 http://localhost/health"
